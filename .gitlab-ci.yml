stages:
  - lint
  - test
  - promote

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck upgrade-gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

logic-test:
  stage: test
  image: kcov/kcov:latest-alpine
  before_script:
    - apk add --no-cache bash curl jq coreutils bats
  script:
    - kcov --include-pattern=/upgrade-gitlab/upgrade-gitlab coverage_output bats tests/
    - coverage_pct=$(jq -r '.percent_covered' coverage_output/bats/coverage.json 2>/dev/null || echo "0.0")
    - echo "Coverage:${coverage_pct}%"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_output/bats/cobertura.xml
    paths:
      - coverage_output/
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

promote-to-master:
  stage: promote
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git remote set-url origin "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin HEAD:master
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PROJECT_PATH == "gitlab-useful-scripts/upgrade-gitlab"

integration-test:
  stage: test
  image: kcov/kcov:latest-alpine
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GITLAB_EDITION: "ce"
  before_script:
    - apk add --no-cache bash jq curl coreutils docker-cli
  script:
    - |
      LATEST=$(curl -s "https://hub.docker.com/v2/repositories/gitlab/gitlab-${GITLAB_EDITION}/tags?page_size=100&ordering=last_updated&name=${GITLAB_EDITION}.0" \
        | jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-'${GITLAB_EDITION}'\\.0$"))] | sort_by(split(".") | map(split("-")[0]) | map(tonumber)) | reverse | .[0]')
      LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1)
      LATEST_MINOR=$(echo "$LATEST" | cut -d. -f2)
      N2_MINOR=$((LATEST_MINOR - 2))
      if [ "$N2_MINOR" -lt 0 ]; then
        LATEST_MAJOR=$((LATEST_MAJOR - 1))
        N2_MINOR=$((N2_MINOR + 12))
      fi
      START_TAG=$(curl -s "https://hub.docker.com/v2/repositories/gitlab/gitlab-${GITLAB_EDITION}/tags?page_size=100&ordering=last_updated&name=${GITLAB_EDITION}.0" \
        | jq -r --arg prefix "${LATEST_MAJOR}.${N2_MINOR}." \
          '[.results[].name | select(startswith($prefix))] | sort_by(split(".") | map(split("-")[0]) | map(tonumber)) | reverse | .[0]')
      echo "Latest: $LATEST / Starting from N-2: $START_TAG"
      docker run -d --name gitlab \
        --hostname gitlab.test \
        -v gitlab-config:/etc/gitlab \
        -v gitlab-logs:/var/log/gitlab \
        -v gitlab-data:/var/opt/gitlab \
        gitlab/gitlab-${GITLAB_EDITION}:${START_TAG}
    - |
      echo "Waiting for GitLab to become healthy (timeout 10m)..."
      timeout 600 bash -c '
        until [ "$(docker inspect --format="{{.State.Health.Status}}" gitlab 2>/dev/null)" = "healthy" ]; do
          sleep 15
        done
      '
      echo "GitLab is healthy."
    - |
      # GitLab 19.0 removed bundled Mattermost: reconfigure hard-aborts ("Removed
      # configurations found in gitlab.rb") if any active mattermost[...] key remains.
      # Strip them up front, mirroring the documented 19.0 manual upgrade step, so the
      # stock instance can cross the 19.0 boundary. (Comments are left untouched.)
      docker exec gitlab sed -i -E "/^[[:space:]]*mattermost/d" /etc/gitlab/gitlab.rb || true
    - |
      set -o pipefail
      kcov --include-pattern=/upgrade-gitlab/upgrade-gitlab coverage_output \
        ./upgrade-gitlab -y --no-step-limit --edition=ee \
        2>&1 | tee upgrade.log
    - |
      FINAL_VERSION=$(docker exec gitlab dpkg -l | grep -E "gitlab-(ce|ee)" | awk '{print $3}')
      echo "Final version: $FINAL_VERSION"
    - |
      # Stuck migration injection tests (real-PG integration verification).
      # Triggers upgrade-gitlab's recovery path by docker-killing the container
      # BEFORE each run. upgrade-gitlab reads _prev_exit from docker inspect at
      # a moment when the container is still stopped (so ExitCode != 0), then
      # auto-starts it and runs wait_for_background_migrations in recovery mode.
      set -e
      echo "=== Stuck migration injection tests ==="

      FATAL_MARK="FATAL ERROR! MANUAL INTERVENTION REQUIRED"

      # Make sure container is running for the initial query / injection.
      if [ "$(docker inspect --format='{{.State.Running}}' gitlab 2>/dev/null)" != "true" ]; then
        docker start gitlab
        timeout 600 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" gitlab 2>/dev/null)" = "healthy" ]; do sleep 15; done'
      fi

      VICTIM_ID=$(docker exec gitlab gitlab-psql -tAc \
        "SELECT id FROM batched_background_migrations WHERE status=3 ORDER BY id LIMIT 1" \
        | tr -d '[:space:]')
      if [ -z "$VICTIM_ID" ]; then
        echo "SKIP: no finished batched_background_migrations to impersonate stuck"
      else
        echo "Victim migration id: $VICTIM_ID"

        _ensure_running() {
          if [ "$(docker inspect --format='{{.State.Running}}' gitlab 2>/dev/null)" != "true" ]; then
            docker start gitlab > /dev/null 2>&1 || true
          fi
          timeout 600 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" gitlab 2>/dev/null)" = "healthy" ]; do sleep 15; done'
        }

        _inject() {
          _ensure_running
          docker exec gitlab gitlab-psql -c \
            "UPDATE batched_background_migrations SET status=$1, updated_at=NOW() - INTERVAL '14 days' WHERE id=$VICTIM_ID;" > /dev/null
          # Kill so that upgrade-gitlab sees _prev_exit != 0 on the next run.
          docker kill gitlab > /dev/null
          until [ "$(docker inspect --format='{{.State.Status}}' gitlab 2>/dev/null)" = "exited" ]; do sleep 1; done
        }
        _restore() {
          _ensure_running
          docker exec gitlab gitlab-psql -c \
            "UPDATE batched_background_migrations SET status=3, updated_at=NOW() WHERE id=$VICTIM_ID;" > /dev/null || true
        }
        trap _restore EXIT

        # Test A: status=4 should cause FATAL exit 1
        _inject 4
        set +e
        ./upgrade-gitlab -y --edition=ee > stuck_a.log 2>&1
        rc=$?
        set -e
        _restore
        if [ "$rc" -ne 1 ] || ! grep -qF "$FATAL_MARK" stuck_a.log || ! grep -q "failed(4)" stuck_a.log; then
          echo "FAIL: status=4 test (rc=$rc)"
          cat stuck_a.log
          exit 1
        fi
        echo "PASS: status=4 triggers FATAL"

        # Test B: status=5 without flag should cause FATAL exit 1 in -y mode
        _inject 5
        set +e
        ./upgrade-gitlab -y --edition=ee > stuck_b.log 2>&1
        rc=$?
        set -e
        _restore
        if [ "$rc" -ne 1 ] || ! grep -qF "$FATAL_MARK" stuck_b.log || ! grep -q "finalizing(5)" stuck_b.log; then
          echo "FAIL: status=5 test (rc=$rc)"
          cat stuck_b.log
          exit 1
        fi
        echo "PASS: status=5 triggers FATAL"

        # Note: --reset-stuck-finalizing is covered by the bats unit test
        # ("full-flow: --reset-stuck-finalizing auto-resets status=5 and proceeds")
        # and is intentionally NOT exercised here: after the reset, the wait
        # loop polls indefinitely on the impersonated row (status=1, complete
        # jobs but never transitions to 3), which would consume several minutes
        # of the integration-test budget for marginal added signal.

        trap - EXIT
      fi
      echo "=== Stuck injection tests done ==="
    - |
      coverage_pct=$(jq -r '.percent_covered' coverage_output/upgrade-gitlab/coverage.json 2>/dev/null || echo "0.0")
      echo "Coverage:${coverage_pct}%"
  coverage: '/Coverage:(\d+[\.,]\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_output/upgrade-gitlab/cobertura.xml
    paths:
      - coverage_output/
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
