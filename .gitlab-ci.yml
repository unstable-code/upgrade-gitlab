stages:
  - lint
  - test
  - promote

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck upgrade-gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

logic-test:
  stage: test
  image: kcov/kcov:latest-alpine
  before_script:
    - apk add --no-cache bash curl jq coreutils bats
  script:
    - kcov --include-pattern=/upgrade-gitlab/upgrade-gitlab coverage_output bats tests/
    - coverage_pct=$(jq -r '.percent_covered' coverage_output/bats/coverage.json 2>/dev/null || echo "0.0")
    - echo "Coverage:${coverage_pct}%"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_output/bats/cobertura.xml
    paths:
      - coverage_output/
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

promote-to-master:
  stage: promote
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git remote set-url origin "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin HEAD:master
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PROJECT_PATH == "gitlab-useful-scripts/upgrade-gitlab"

integration-test:
  stage: test
  image: kcov/kcov:latest-alpine
  variables:
    START_VERSION: "17.10.0"
    GITLAB_EDITION: "ce"
  before_script:
    - apk add --no-cache bash jq curl coreutils docker-cli
  script:
    - |
      docker run -d --name gitlab \
        --hostname gitlab.test \
        -p 80:80 \
        -v gitlab-config:/etc/gitlab \
        -v gitlab-logs:/var/log/gitlab \
        -v gitlab-data:/var/opt/gitlab \
        gitlab/gitlab-${GITLAB_EDITION}:${START_VERSION}-${GITLAB_EDITION}.0
    - |
      echo "Waiting for GitLab to become healthy (timeout 10m)..."
      timeout 600 bash -c '
        until [ "$(docker inspect --format="{{.State.Health.Status}}" gitlab 2>/dev/null)" = "healthy" ]; do
          sleep 15
        done
      '
      echo "GitLab is healthy."
    - |
      kcov --include-pattern=/upgrade-gitlab/upgrade-gitlab coverage_output \
        ./upgrade-gitlab -y --no-step-limit --target-url=http://localhost \
        > upgrade.log 2>&1 || { tail -100 upgrade.log; exit 1; }
      tail -20 upgrade.log
    - |
      FINAL_VERSION=$(docker exec gitlab dpkg -l | grep "gitlab-${GITLAB_EDITION}" | awk '{print $3}')
      echo "Final version: $FINAL_VERSION"
    - |
      coverage_pct=$(jq -r '.percent_covered' coverage_output/bash/coverage.json 2>/dev/null || echo "0.0")
      echo "Coverage:${coverage_pct}%"
  coverage: '/Coverage:(\d+[\.,]\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_output/bash/cobertura.xml
    paths:
      - coverage_output/
    when: always
  tags:
    - linux
    - self-hosted
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  timeout: 6h
