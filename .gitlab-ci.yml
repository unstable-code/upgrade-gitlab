stages:
  - lint
  - test
  - image
  - promote

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck upgrade-gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

logic-test:
  stage: test
  image: kcov/kcov:latest-alpine
  before_script:
    - apk add --no-cache bash curl jq coreutils bats
  script:
    - kcov --include-pattern=/upgrade-gitlab/upgrade-gitlab coverage_output bats tests/
    - coverage_pct=$(jq -r '.percent_covered' coverage_output/bats/coverage.json 2>/dev/null || echo "0.0")
    - echo "Coverage:${coverage_pct}%"
  coverage: '/Coverage:(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_output/bats/cobertura.xml
    paths:
      - coverage_output/
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The age image the script encrypts the configuration archive with (#32). Run by hand when
# AGE_VERSION changes, then pin the printed digest in the script's AGE_IMAGE. Manual and allowed to
# fail, so it never holds up promotion.
age-image:
  stage: image
  image: golang:1.26
  variables:
    AGE_VERSION: v1.3.2
    CRANE_VERSION: v0.22.1
  before_script:
    - go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/age" sh ci/build-age-image.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_SERVER_HOST == "gitlab.gggames.synology.me"
      when: manual
      allow_failure: true

promote-to-master:
  stage: promote
  image: alpine:latest
  # Back-to-back develop pushes would otherwise promote concurrently, and whichever push
  # lands second with the older commit fails as non-fast-forward. The group runs one job at
  # a time; landing them in pipeline order also needs the group's process mode set to
  # oldest_first (a project-side setting: PUT /projects/:id/resource_groups/promote-to-master).
  resource_group: promote-to-master
  before_script:
    - apk add --no-cache git
  script:
    - git remote set-url origin "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin HEAD:master
  rules:
    # Guards on the host, not the project path: the path has already changed three times
    # (gitlab-useful-scripts -> unstable-code -> peter/gitlab) and each rename silently
    # disabled promotion until someone noticed master had stopped moving.
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_SERVER_HOST == "gitlab.gggames.synology.me"
