include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# The age release the age image is built from (age-image) and scanned as (age-scan-target).
variables:
  AGE_VERSION: v1.3.2

stages:
  - lint
  - test
  - image
  - promote

# When the age image the script pins (AGE_IMAGE) is scanned (#34): on master, where the CycloneDX SBOM
# feeds continuous vulnerability scanning, whenever the pin could have changed, and from the weekly
# schedule. Continuous scanning only matches apk/deb/rpm packages, so the Go modules inside the age
# binary are only checked by an actual scan; the schedule is what re-checks them against new advisories.
.age-scan-rules:
  rules:
    - if: $CI_SERVER_HOST != "gitlab.gggames.synology.me"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [upgrade-gitlab, ci/**/*, .gitlab-ci.yml]

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck upgrade-gitlab
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

logic-test:
  stage: test
  image: kcov/kcov:latest-alpine
  before_script:
    - apk add --no-cache bash curl jq coreutils bats
  script:
    - kcov --include-pattern=/upgrade-gitlab/upgrade-gitlab coverage_output bats tests/
    - coverage_pct=$(jq -r '.percent_covered' coverage_output/bats/coverage.json 2>/dev/null || echo "0.0")
    - echo "Coverage:${coverage_pct}%"
  coverage: '/Coverage:(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage_output/bats/cobertura.xml
    paths:
      - coverage_output/
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The age image the script encrypts the configuration archive with (#32). Run by hand when
# AGE_VERSION changes, then pin the printed digest in the script's AGE_IMAGE. Manual and allowed to
# fail, so it never holds up promotion.
age-image:
  stage: image
  image: golang:1.26
  variables:
    CRANE_VERSION: v0.22.1
  before_script:
    - go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/age" sh ci/build-age-image.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_SERVER_HOST == "gitlab.gggames.synology.me"
      when: manual
      allow_failure: true

# What container_scanning scans: the amd64 image inside the pinned index (arm64 is built from the same
# source), named by its per-arch tag. Not by digest, although that is what the script pins: Trivy
# cannot scan an index digest (it fetches the platform manifest, then rejects it for not matching the
# requested digest), and GitLab 19.3.3 fails to ingest findings whose image is a bare digest
# (`…/age@sha256:…`): the vulnerability UUIDs computed at store and at ingestion no longer match, and
# ingestion stops with NoMethodError on nil (pipeline #692). The tag must still name the pinned image,
# so it is checked against the pinned amd64 digest first and the job fails if the tag has moved.
age-scan-target:
  stage: lint
  image:
    name: gcr.io/go-containerregistry/crane/debug:v0.22.1
    entrypoint: [""]
  script:
    - pinned=$(sed -n 's/^AGE_IMAGE=//p' upgrade-gitlab)
    - want=$(crane digest --platform linux/amd64 "$pinned")
    - target="${pinned%@*}:$AGE_VERSION-amd64"
    - got=$(crane digest "$target")
    - |
      if [ "$got" != "$want" ]; then
        echo "$target is $got, but the pinned image's amd64 manifest is $want: AGE_VERSION and AGE_IMAGE disagree" >&2
        exit 1
      fi
    - echo "CS_IMAGE=$target" | tee scan-target.env
  artifacts:
    reports:
      dotenv: scan-target.env
  rules: !reference [.age-scan-rules, rules]

# From the Container-Scanning template. Language packages are scanned too: the default only reports
# OS packages, which would leave out the age binary's Go modules, the part that matters here.
container_scanning:
  needs: [age-scan-target]
  dependencies: [age-scan-target]
  variables:
    CS_DISABLE_LANGUAGE_VULNERABILITY_SCAN: "false"
  rules: !reference [.age-scan-rules, rules]

promote-to-master:
  stage: promote
  image: alpine:latest
  # Back-to-back develop pushes would otherwise promote concurrently, and whichever push
  # lands second with the older commit fails as non-fast-forward. The group runs one job at
  # a time; landing them in pipeline order also needs the group's process mode set to
  # oldest_first (a project-side setting: PUT /projects/:id/resource_groups/promote-to-master).
  resource_group: promote-to-master
  before_script:
    - apk add --no-cache git
  script:
    - git remote set-url origin "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin HEAD:master
  rules:
    # Guards on the host, not the project path: the path has already changed three times
    # (gitlab-useful-scripts -> unstable-code -> peter/gitlab) and each rename silently
    # disabled promotion until someone noticed master had stopped moving.
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_SERVER_HOST == "gitlab.gggames.synology.me"
